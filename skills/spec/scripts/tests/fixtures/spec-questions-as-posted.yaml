    question: "Does the 48-hour hold count only the hours the shop is open?"
    options:
      - {id: A, text: "Count opening hours only.", consequence: "A hold placed on Saturday lasts until Tuesday."}
      - {id: B, text: "Count every hour.", consequence: "A hold placed on Saturday evening ends before the shop reopens."}
